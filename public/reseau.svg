<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le réseau +3 Studio">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Points réseau discrets -->
  <g fill="#bbff00" opacity="0.18">
    <circle cx="70" cy="120" r="3"/>
    <circle cx="330" cy="110" r="3"/>
    <circle cx="60" cy="250" r="2.5"/>
    <circle cx="345" cy="255" r="2.5"/>
    <circle cx="110" cy="60" r="2"/>
    <circle cx="300" cy="330" r="2"/>
  </g>
  <g stroke="#bbff00" stroke-width="1" opacity="0.10">
    <line x1="70" y1="120" x2="200" y2="200"/>
    <line x1="330" y1="110" x2="200" y2="200"/>
    <line x1="60" y1="250" x2="200" y2="200"/>
    <line x1="345" y1="255" x2="200" y2="200"/>
  </g>

  <!-- Silhouette -->
  <g fill="url(#sil)">
    <circle cx="200" cy="158" r="52"/>
    <path d="M108 330 Q108 232 200 232 Q292 232 292 330 Z"/>
  </g>

  <!-- Logo +3 par-dessus -->
  <g>
    <circle cx="200" cy="250" r="46" fill="#0A0A0A" opacity="0.72"/>
    <text x="200" y="250" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52"
          fill="#bbff00" letter-spacing="-1">+3</text>
  </g>
</svg>
